<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background matching --bg -->
  <rect width="32" height="32" rx="8" fill="#050505"/>
  <!-- Subtle purple border -->
  <rect x="1" y="1" width="30" height="30" rx="7" stroke="#C47BE4" stroke-width="1" stroke-opacity="0.4"/>
  <!-- "EL" monogram, bold, purple accent -->
  <text
    x="50%"
    y="50%"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="14"
    letter-spacing="-0.5"
    fill="#C47BE4"
  >EL</text>
  <!-- Small accent dot (orange) -->
  <circle cx="25" cy="8" r="2.5" fill="#FF7A5C"/>
</svg>
